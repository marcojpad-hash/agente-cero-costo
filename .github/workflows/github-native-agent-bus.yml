name: GitHub-native agent bus
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[BUS]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and append issue to repository bus
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'No ingresado: solo propietarios y colaboradores autorizados pueden emitir al bus.' });
              return;
            }
            const title = issue.title || '';
            const body = issue.body || '';
            const match = title.match(/^\[BUS\]\s*(actualizacion|indicacion|aviso|hecho)\s*[-|:]\s*(.+)$/i);
            if (!match) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'No ingresado: usa [BUS] tipo - emisor en el título.' });
              return;
            }
            const tipo = match[1].toLowerCase();
            const de = match[2].trim().slice(0, 100);
            if (!de || body.trim().length === 0 || body.length > 100000) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'No ingresado: cuerpo obligatorio, máximo 100000 caracteres.' });
              return;
            }
            const path = 'conector/bus/gh-issue-' + issue.number + '.json';
            let version = 0;
            try {
              const v = await github.rest.repos.getContent({ ...context.repo, path: 'avisos/VERSION', ref: context.payload.repository.default_branch });
              version = Number(Buffer.from(v.data.content, 'base64').toString('utf8').trim()) || 0;
            } catch (_) {}
            const event = { formato: 1, id: 'gh-issue-' + issue.number, issue: issue.number, issue_url: issue.html_url, fecha: issue.created_at, version, de, tipo, mensaje: body.trim(), transporte: 'github-issues' };
            const content = Buffer.from(JSON.stringify(event, null, 2) + '\n').toString('base64');
            try {
              await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path, message: 'bus: ingest GitHub issue #' + issue.number, content, branch: context.payload.repository.default_branch });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'Evento incorporado al bus compartido en ' + path + '. Cualquier agente con acceso al repositorio puede leerlo.' });
