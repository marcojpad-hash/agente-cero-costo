name: Puente MCP tests

on:
  push:
    branches: [feature/puente-bidireccional-agentes]
    paths:
      - "puente-lectura/puente_mcp.py"
      - "puente-lectura/requirements-mcp.txt"
      - "tests/test_puente_mcp.py"
      - ".github/workflows/puente-mcp-tests.yml"
  pull_request:
    paths:
      - "puente-lectura/puente_mcp.py"
      - "puente-lectura/requirements-mcp.txt"
      - "tests/test_puente_mcp.py"
      - ".github/workflows/puente-mcp-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r puente-lectura/requirements-mcp.txt
      - run: python -m unittest discover -s tests -p "test_puente_mcp.py" -v
